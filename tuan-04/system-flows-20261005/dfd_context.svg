<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="1700" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">DFD — Context (Process 0): WMS</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Ranh giới phần mềm; mũi tên biểu diễn dữ liệu, không biểu diễn việc di chuyển hàng vật lý.</tspan></text><polyline points="360,225 520,225 520,385 650,385" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="418.4" y="279" width="203.2" height="40" rx="3" fill="white" fill-opacity="0.96"/><text x="520" y="286.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="520" dy="0">Định danh; lệnh quản trị</tspan><tspan x="520" dy="19">User/RBAC, danh mục</tspan></text><polyline points="650,430 460,430 460,275 360,275" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="362.3" y="326.5" width="195.4" height="40" rx="3" fill="white" fill-opacity="0.96"/><text x="460" y="334" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="460" dy="0">Token/kết quả đăng nhập</tspan><tspan x="460" dy="19">Kết quả quản trị / lỗi</tspan></text><polyline points="390,525 540,525 540,465 650,465" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="469" width="250" height="60" rx="3" fill="white" fill-opacity="0.96"/><text x="540" y="467" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="540" dy="0">Định danh; dữ liệu nghiệp vụ</tspan><tspan x="540" dy="19">Nhập/xuất/chuyển/kiểm kê/duyệt</tspan><tspan x="540" dy="19">Truy vấn danh mục, tồn, ledger</tspan></text><polyline points="820,495 820,675 245,675 245,620" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="415.3" y="649" width="234.4" height="40" rx="3" fill="white" fill-opacity="0.96"/><text x="532.5" y="656.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="532.5" dy="0">Token; phiếu/task/trạng thái</tspan><tspan x="532.5" dy="19">Danh mục, tồn, ledger / lỗi</tspan></text><polyline points="1260,365 1120,365 1120,385 990,385" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1022.3" y="349" width="195.4" height="40" rx="3" fill="white" fill-opacity="0.96"/><text x="1120" y="356.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1120" dy="0">Định danh; truy vấn</tspan><tspan x="1120" dy="19">Danh mục / tồn khả dụng</tspan></text><polyline points="990,460 1140,460 1140,415 1260,415" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1061.8" y="411.5" width="156.4" height="40" rx="3" fill="white" fill-opacity="0.96"/><text x="1140" y="419" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1140" dy="0">Token; danh mục</tspan><tspan x="1140" dy="19">Tồn khả dụng / lỗi</tspan></text><rect x="100" y="190" width="260" height="110" rx="0" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><text x="230" y="239.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="230" dy="0">E1 — ADMIN</tspan><tspan x="230" dy="21">Quản trị hệ thống</tspan></text><rect x="100" y="490" width="290" height="130" rx="0" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><text x="245" y="539" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="245" dy="0">E2 — Nhân viên vận hành</tspan><tspan x="245" dy="21">WH_MANAGER / SUPERVISOR</tspan><tspan x="245" dy="21">RECEIVER / PICKER / INSPECTOR</tspan></text><rect x="1260" y="340" width="280" height="110" rx="0" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><text x="1400" y="389.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1400" dy="0">E3 — VIEWER</tspan><tspan x="1400" dy="21">Tra cứu tồn khả dụng</tspan></text><rect x="650" y="355" width="340" height="140" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="820" y="409" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="820" dy="0">0 — HỆ THỐNG WMS</tspan><tspan x="820" dy="21">Xác thực, danh mục, chứng từ</tspan><tspan x="820" dy="21">Tồn kho và sổ cái</tspan></text><text x="28" y="860" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">E1/E2/E3 là nhóm người dùng ngoài phần mềm, không phải các service. Context không hiển thị data store nội bộ.</tspan></text><text x="28" y="884" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Supplier/khách hàng chưa có tích hợp trực tiếp được xác nhận: dữ liệu chứng từ do nhân viên E2 nhập.</tspan></text><text x="28" y="908" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Các chức năng Outbound/Transfer/Cycle Count là phạm vi thiết kế; sơ đồ không xác nhận code đã triển khai.</tspan></text></g></svg>