<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="870" viewBox="0 0 3000 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="3000" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Điều chuyển giữa hai kho</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">LUỒNG THIẾT KẾ. TRANSIT vẫn là đề xuất chưa được Domain B xác nhận; không vẽ ghi tồn transit như đã chốt.</tspan></text><rect x="20" y="115" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Supervisor / kho nguồn</text><rect x="20" y="305" width="2960" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Picker nguồn / Receiver đích</text><rect x="20" y="495" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE + DB</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,567 500,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,567 755,567 755,550 785,550" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="835,550 952.5,550 952.5,187 1070,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="936.7" y="342.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="952.5" y="359.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="952.5" dy="0">Có</tspan></text><polyline points="1295,187 1325,187 1325,377 1355,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1580,377 1610,377 1610,550 1640,550" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1690,550 1807.5,550 1807.5,187 1925,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1791.7" y="342.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1807.5" y="359.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1807.5" dy="0">Có</tspan></text><polyline points="2150,187 2180,187 2180,567 2210,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2435,567 2495,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2720,567 2780,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="810,575 810,268 875,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="842.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="842.5" dy="0">Không</tspan></text><polyline points="997.5,300 997.5,680 327.5,680 327.5,229" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="596" y="654" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="662.5" y="671" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="662.5" dy="0">Xử lý / thử lại</tspan></text><polyline points="1665,575 1665,268 1730,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1670" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1697.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1697.5" dy="0">Không</tspan></text><polyline points="1852.5,300 1852.5,658 1182.5,658 1182.5,229" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1451" y="632" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1517.5" y="649" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1517.5" dy="0">Xử lý / thử lại</tspan></text><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Tạo yêu cầu điều chuyển</tspan><tspan x="327.5" dy="21">Kho nguồn/đích; SKU/lot/qty</tspan></text><rect x="500" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Quyền từng kho, BIN, UOM</tspan><tspan x="612.5" dy="21">Đọc tồn nguồn + reserved</tspan><tspan x="612.5" dy="21">Bảo toàn identity và expiry</tspan></text><polygon points="810,525 835,550 810,575 785,550" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="810" y="558" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">×</tspan></text><text x="810" y="513" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">Hợp lệ?</tspan></text><rect x="1070" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1084" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1078 170 Q1084 156 1090 170" fill="none" stroke="#507091"/><text x="1182.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Giao Picker nguồn</tspan><tspan x="1182.5" dy="21">Và Receiver tại kho đích</tspan></text><rect x="1355" y="335" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1369" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1363 360 Q1369 346 1375 360" fill="none" stroke="#507091"/><text x="1467.5" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Picker kiểm đếm / chuẩn bị</tspan><tspan x="1467.5" dy="21">Receiver xác nhận hàng tới</tspan></text><polygon points="1665,525 1690,550 1665,575 1640,550" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1665" y="558" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1665" dy="0">×</tspan></text><text x="1665" y="513" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1665" dy="0">Số lượng khớp?</tspan></text><rect x="1925" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1939" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1933 170 Q1939 156 1945 170" fill="none" stroke="#507091"/><text x="2037.5" y="171" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2037.5" dy="0">CHƯA CHỐT: hàng in-transit</tspan><tspan x="2037.5" dy="21">Chọn BIN TRANSIT hay tracking</tspan><tspan x="2037.5" dy="21">Định nghĩa thời điểm ghi tồn</tspan></text><rect x="2210" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2322.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2322.5" dy="0">Khi contract được chốt:</tspan><tspan x="2322.5" dy="21">Tx nguồn OUT / đích IN</tspan><tspan x="2322.5" dy="21">Tồn + ledger + audit + phiếu</tspan></text><rect x="2495" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2607.5" y="561.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2607.5" dy="0">Trả trạng thái hoàn tất</tspan><tspan x="2607.5" dy="21">Đối soát hai kho</tspan></text><circle cx="2798" cy="567" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2798" y="609" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2798" dy="0">Hoàn tất</tspan></text><rect x="875" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="889" cy="247" r="4" fill="none" stroke="#507091"/><path d="M883 260 Q889 246 895 260" fill="none" stroke="#507091"/><text x="997.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="997.5" dy="0">Từ chối / sửa yêu cầu</tspan><tspan x="997.5" dy="21">Không ghi movement</tspan></text><rect x="1730" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1744" cy="247" r="4" fill="none" stroke="#507091"/><path d="M1738 260 Q1744 246 1750 260" fill="none" stroke="#507091"/><text x="1852.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1852.5" dy="0">Báo chênh lệch / thiếu hàng</tspan><tspan x="1852.5" dy="21">Supervisor điều phối</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Bước CHƯA CHỐT là design gate: không được coi sơ đồ này là contract đủ để implement/deploy transfer.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Hai kho dùng cùng DB và chuyển tức thời có thể atomic OUT/IN; chuyển thực tế nhiều giờ phải chốt mô hình in-transit.</tspan></text><text x="28" y="828" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Không xóa tồn khỏi hệ thống trong khi hàng đang vận chuyển. Không tự cấp quyền kho đích từ role kho nguồn.</tspan></text></g></svg>