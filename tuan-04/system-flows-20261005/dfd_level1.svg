ze="16" text-anchor="middle" fill="#17283d"><tspan x="650" dy="0">5.0 — Tra cứu / đối soát</tspan><tspan x="650" dy="21">Danh mục, phiếu/task</tspan><tspan x="650" dy="21">Tồn theo scope; ledger</tspan></text><rect x="1720" y="140" width="370" height="110" rx="0" fill="#eef8ef" stroke="#507091" stroke-width="2"/><line x1="1736" y1="140" x2="1736" y2="250" stroke="#507091" stroke-width="2"/><text x="1905" y="179" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1905" dy="0">D1 — Users &amp; RBAC</tspan><tspan x="1905" dy="21">users / roles / permissions</tspan><tspan x="1905" dy="21">user_roles / role_permissions</tspan></text><rect x="1720" y="405" width="370" height="115" rx="0" fill="#eef8ef" stroke="#507091" stroke-width="2"/><line x1="1736" y1="405" x2="1736" y2="520" stroke="#507091" stroke-width="2"/><text x="1905" y="446.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1905" dy="0">D2 — Master data</tspan><tspan x="1905" dy="21">warehouses / locations; SKU/UOM</tspan><tspan x="1905" dy="21">conversion / barcode / suppliers</tspan></text><rect x="1720" y="730" width="370" height="115" rx="0" fill="#eef8ef" stroke="#507091" stroke-width="2"/><line x1="1736" y1="730" x2="1736" y2="845" stroke="#507091" stroke-width="2"/><text x="1905" y="771.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1905" dy="0">D3 — Chứng từ nghiệp vụ</tspan><tspan x="1905" dy="21">receipts/lines, adjustments/lines</tspan><tspan x="1905" dy="21">shipment/count (scope thiết kế)</tspan></text><rect x="1720" y="1000" width="370" height="110" rx="0" fill="#eef8ef" stroke="#507091" stroke-width="2"/><line x1="1736" y1="1000" x2="1736" y2="1110" stroke="#507091" stroke-width="2"/><text x="1905" y="1039" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1905" dy="0">D4 — Inventory</tspan><tspan x="1905" dy="21">BIN/SKU/lot/serial/expiry</tspan><tspan x="1905" dy="21">on_hand / reserved / version</tspan></text><rect x="1720" y="1250" width="400" height="110" rx="0" fill="#eef8ef" stroke="#507091" stroke-width="2"/><line x1="1736" y1="1250" x2="1736" y2="1360" stroke="#507091" stroke-width="2"/><text x="1920" y="1289" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1920" dy="0">D5 — Stock ledger</tspan><tspan x="1920" dy="21">movement/reference types</tspan><tspan x="1920" dy="21">INSERT movement; không UPDATE/DELETE</tspan></text><text x="28" y="1440" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">D1: RBAC; D2: danh mục; D3: chứng từ nghiệp vụ (bổ sung tuần 3); D4: tồn; D5: ledger append-only.</tspan></text><text x="28" y="1464" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">3.0 và 4.0 cùng DB transaction khi thay đổi on_hand: không commit phiếu trước rồi ghi tồn/ledger ở transaction khác.</tspan></text><text x="28" y="1488" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">D4 reserved chỉ cập nhật cho reserve/release, không INSERT D5. Tồn khả dụng tổng hợp lọc is_pickable, loại QC/DAMAGED.</tspan></text></g></svg>