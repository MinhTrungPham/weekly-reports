y="21">cycle_count_inspection.bpmn</tspan></text><rect x="770" y="940" width="310" height="85" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="925" y="977" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="925" dy="0">Điều chỉnh có duyệt</tspan><tspan x="925" dy="21">adjustment_approval.bpmn</tspan></text><rect x="770" y="1100" width="310" height="85" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="925" y="1137" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="925" dy="0">Tra cứu / tem QR</tspan><tspan x="925" dy="21">lookup_reporting.bpmn</tspan></text><rect x="770" y="1260" width="310" height="85" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="925" y="1297" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="925" dy="0">Đảo sổ cái</tspan><tspan x="925" dy="21">ledger_reversal.bpmn</tspan></text><polygon points="1385,675 1410,700 1385,725 1360,700" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1385" y="708" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1385" dy="0">×</tspan></text><text x="1385" y="663" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1385" dy="0">Kết thúc thao tác</tspan></text><polygon points="1725,675 1750,700 1725,725 1700,700" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1725" y="708" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1725" dy="0">×</tspan></text><text x="1725" y="663" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1725" dy="0">Làm tiếp?</tspan></text><circle cx="1978" cy="700" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="1978" y="742" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1978" dy="0">Rời ứng dụng</tspan></text><text x="28" y="1560" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Mỗi call activity được phân rã trong file BPMN cùng tên; auth/permission/scope vẫn được kiểm tra tại API từng chức năng.</tspan></text><text x="28" y="1584" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Đây là bản thiết kế theo tài liệu: chi tiết TRANSIT, FEFO và vòng đời chứng từ Outbound chưa được chốt hoàn toàn.</tspan></text></g></svg>