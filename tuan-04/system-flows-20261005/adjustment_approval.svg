"18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="210" y="145" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="224" cy="157" r="4" fill="none" stroke="#507091"/><path d="M218 170 Q224 156 230 170" fill="none" stroke="#507091"/><text x="315" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="315" dy="0">Chọn inventoryId</tspan><tspan x="315" dy="21">actualQty base + reason</tspan></text><rect x="470" y="520" width="210" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="575" y="546" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="575" dy="0">Quyền + scope + owner</tspan><tspan x="575" dy="21">Snapshot identity/qty/version</tspan><tspan x="575" dy="21">Lưu DRAFT</tspan></text><polygon points="750,530 775,555 750,580 725,555" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="750" y="563" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="750" dy="0">×</tspan></text><text x="750" y="518" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="750" dy="0">Hợp lệ?</tspan></text><rect x="470" y="145" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="484" cy="157" r="4" fill="none" stroke="#507091"/><path d="M478 170 Q484 156 490 170" fill="none" stroke="#507091"/><text x="575" y="192" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="575" dy="0">Sửa dữ liệu đề xuất</tspan></text><rect x="830" y="145" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="844" cy="157" r="4" fill="none" stroke="#507091"/><path d="M838 170 Q844 156 850 170" fill="none" stroke="#507091"/><text x="935" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="935" dy="0">Rà soát / sửa DRAFT</tspan><tspan x="935" dy="21">Gửi duyệt</tspan></text><rect x="1090" y="520" width="210" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1195" y="546" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1195" dy="0">Owner + DRAFT</tspan><tspan x="1195" dy="21">Kiểm tra snapshot</tspan><tspan x="1195" dy="21">PENDING_APPROVAL</tspan></text><polygon points="1370,530 1395,555 1370,580 1345,555" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1370" y="563" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1370" dy="0">×</tspan></text><text x="1370" y="518" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1370" dy="0">Snapshot đúng?</tspan></text><rect x="1090" y="145" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1104" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1098 170 Q1104 156 1110 170" fill="none" stroke="#507091"/><text x="1195" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1195" dy="0">409: Hủy đề xuất</tspan><tspan x="1195" dy="21">Kiểm đếm / lập phiếu mới</tspan></text><rect x="1460" y="335" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1474" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1468 360 Q1474 346 1480 360" fill="none" stroke="#507091"/><text x="1565" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1565" dy="0">Xem chênh lệch / reason</tspan><tspan x="1565" dy="21">Approve hoặc Reject</tspan></text><rect x="1720" y="520" width="210" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1825" y="546" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1825" dy="0">Quyền đúng kho từ DB</tspan><tspan x="1825" dy="21">Reviewer ≠ proposer</tspan><tspan x="1825" dy="21">PENDING_APPROVAL</tspan></text><polygon points="1995,530 2020,555 1995,580 1970,555" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1995" y="563" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1995" dy="0">×</tspan></text><text x="1995" y="518" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1995" dy="0">Kết quả?</tspan></text><rect x="2070" y="610" width="210" height="65" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2175" y="626.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2175" dy="0">Lưu rejection_reason</tspan><tspan x="2175" dy="21">Status REJECTED</tspan><tspan x="2175" dy="21">Không ghi movement</tspan></text><rect x="2070" y="490" width="210" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2175" y="516" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2175" dy="0">Kiểm tra snapshot/reserved</tspan><tspan x="2175" dy="21">Tx: ADJUST_IN / OUT + tồn</tspan><tspan x="2175" dy="21">Audit + APPROVED</tspan></text><polygon points="2355,505 2380,530 2355,555 2330,530" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="2355" y="538" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="2355" dy="0">×</tspan></text><text x="2355" y="493" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2355" dy="0">Commit?</tspan></text><rect x="1720" y="335" width="210" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1734" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1728 360 Q1734 346 1740 360" fill="none" stroke="#507091"/><text x="1825" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1825" dy="0">Lỗi quyền/trạng thái/DB</tspan><tspan x="1825" dy="21">Tải lại; xử lý rồi thử lại</tspan></text><circle cx="2638" cy="530" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2638" y="572" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2638" dy="0">APPROVED</tspan></text><circle cx="2638" cy="640" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2638" y="682" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2638" dy="0">REJECTED</tspan></text><text x="28" y="760" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Approve dùng version + system_qty từ DB, không tin client. ADJUST_OUT không được giảm tồn dưới reserved hoặc dưới 0.</tspan></text><text x="28" y="784" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Commit gồm inventory + INSERT ledger + audit + APPROVED. Reject/cancel không thay đổi tồn.</tspan></text><text x="28" y="808" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Snapshot stale: 409, proposer hủy và lập mới; không tự tính lại delta. Submit/approve lỗi kỹ thuật có thể thử lại.</tspan></text></g></svg>