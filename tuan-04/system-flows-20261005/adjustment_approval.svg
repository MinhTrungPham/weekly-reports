<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="850" viewBox="0 0 3000 850"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="3000" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Điều chỉnh tồn kho có phê duyệt</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Inspector tạo snapshot → submit → người có ADJUSTMENT.APPROVE/REJECT trong kho xét duyệt; không tự duyệt.</tspan></text><rect x="20" y="115" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Inspector / proposer</text><rect x="20" y="305" width="2960" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">WH_MANAGER / reviewer</text><rect x="20" y="495" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE + DB</text><polyline points="176,193 193,193 193,187 210,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="420,187 445,187 445,562 470,562" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="374.6" y="348.5" width="140.8" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="445" y="365.5" font-size="14" text-anchor="middle" fill="#17283d"><ts