,187 1300,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1288" y="161" width="94" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1335" y="178" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1335" dy="0">409: stale</tspan></text><polyline points="1195,145 1195,120 315,120 315,145" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="684.6" y="94" width="140.8" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="755" y="111" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="755" dy="0">Cancel + tạo mới</tspan></text><polyline points="1670,377 1695,377 1695,562 1720,562" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1605.1" y="443.5" width="179.79999999999998" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1695" y="460.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1695" dy="0">POST approve / reject</tspan></text><polyline points="1930,562 1950,562 1950,555 1970,555" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2020,555 2045,555 2045,532 2070,532" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="2009.7" y="517.5" width="70.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="2045" y="534.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2045" dy="0">Approve</tspan></text><polyline points="1995,580 1995,642 2070,642" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1966" y="616" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="2032.5" y="633" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2032.5" dy="0">Reject + reason</tspan></text><polyline points="1995,530 1995,377 1930,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1868.7" y="351" width="187.6" height="20" rx="3" fill="white" 