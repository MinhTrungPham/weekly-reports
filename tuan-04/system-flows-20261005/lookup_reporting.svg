<svg xmlns="http://www.w3.org/2000/svg" width="2145" height="870" viewBox="0 0 2145 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="2145" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Tra cứu tồn, sổ cái và mã hàng</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Bao phủ Viewer và người vận hành; QR là tem SKU/UOM, không tự chứa lot/expiry khi payload chưa thiết kế.</tspan></text><rect x="20" y="115" width="2105" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Viewer / nhân viên kho</text><rect x="20" y="305" width="2105" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE</text><rect x="20" y="495" width="2105" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">DB danh mục / tồn / ledger</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,377 500,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,377 755,377 755,567 785,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1010,567 1040,567 1040,377 1070,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1295,377 1355,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1580,377 1610,377 1610,187 1640,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1865,187 1925,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="171" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Chọn kho/SKU/vị trí</tspan><tspan x="327.5" dy="21">Bộ lọc / phân trang / barcode</tspan><tspan x="327.5" dy="21">Hoặc yêu cầu tem QR SKU/UOM</tspan></text><rect x="500" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Xác thực + quyền đọc</tspan><tspan x="612.5" dy="21">Tồn/ledger theo scope kho</tspan><tspan x="612.5" dy="21">Danh mục chung theo policy</tspan></text><rect x="785" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="897.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="897.5" dy="0">Đọc inventory / locations</tspan><tspan x="897.5" dy="21">SKU/UOM/conversion/barcode</tspan><tspan x="897.5" dy="21">Ledger nếu có quyền</tspan></text><rect x="1070" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1182.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Detail: on_hand - reserved</tspan><tspan x="1182.5" dy="21">Summary: chỉ BIN is_pickable</tspan><tspan x="1182.5" dy="21">Loại QC/DAMAGED</tspan></text><rect x="1355" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1467.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Trả ID/Decimal string</tspan><tspan x="1467.5" dy="21">DATE YYYY-MM-DD; timestamp UTC</tspan><tspan x="1467.5" dy="21">Kết quả / meta / lỗi</tspan></text><rect x="1640" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1654" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1648 170 Q1654 156 1660 170" fill="none" stroke="#507091"/><text x="1752.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1752.5" dy="0">Xem / đối soát tồn và ledger</tspan><tspan x="1752.5" dy="21">Render QR, in tem nếu có dữ liệu</tspan></text><circle cx="1943" cy="187" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="1943" y="229" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1943" dy="0">Hoàn tất</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Tra cứu không tạo movement. QR render ở UI hoặc dịch vụ QR theo contract; không bắt buộc Cloudinary.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Dữ liệu row available khác tổng sellable: row QC vẫn có on_hand, nhưng không được cộng vào tổng pickable.</tspan></text><text x="28" y="828" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Viewer xem ledger hay không phụ thuộc permission catalog được team chốt; không suy ra từ tên role.</tspan></text></g></svg>