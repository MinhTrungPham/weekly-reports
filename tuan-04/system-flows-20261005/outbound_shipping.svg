<svg xmlns="http://www.w3.org/2000/svg" width="3285" height="870" viewBox="0 0 3285 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="3285" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Xuất hàng: Reserve, Pick và Ship</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">LUỒNG THIẾT KẾ. Tài liệu có PICK_OUT/PICK_IN/SHIP; chưa khẳng định đã có đủ API.</tspan></text><rect x="20" y="115" width="3245" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Supervisor / người điều phối</text><rect x="20" y="305" width="3245" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Picker / người xác nhận xuất</text><rect x="20" y="495" width="3245" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE + DB</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,567 500,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,567 755,567 755,550 785,550" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="835,550 952.5,550 952.5,567 1070,56