5" dy="0">Xử lý / thử lại</tspan></text><polyline points="1950,575 1950,268 2015,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1982.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1982.5" dy="0">Không</tspan></text><polyline points="2137.5,300 2137.5,658 1467.5,658 1467.5,229" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1736" y="632" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1802.5" y="649" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1802.5" dy="0">Xử lý / thử lại</tspan></text><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Tạo yêu cầu xuất</tspan><tspan x="327.5" dy="21">SKU, base qty, kho</tspan></text><rect x="500" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Quyền/scope; đọc tồn khả dụng</tspan><tspan x="612.5" dy="21">Chỉ BIN is_pickable</tspan><tspan x="612.5" dy="21">Không chọn QC/DAMAGED</tspan></text><polygon points="810,525 835,550 810,575 785,550" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="810" y="558" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">×</tspan></text><text x="810" y="513" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">Đủ tồn?</tspan></text><rect x="1070" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1182.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Tx giữ chỗ theo dòng tồn</tspan><tspan x="1182.5" dy="21">reserved += qty; version tăng</tspan><tspan x="1182.5" dy="21">Không ghi stock ledger</tspan></text><rect x="1355" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1369" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1363 170 Q1369 156 1375 170" fill="none" stroke="#507091"/><text x="1467.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Giao task cho Picker</tspan><tspan x="1467.5" dy="21">Đúng kho, ACTIVE</tspan></text><rect x="1640" y="335" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1654" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1648 360 Q1654 346 1660 360" fill="none" stroke="#507091"/><text x="1752.5" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1752.5" dy="0">Nhận task, quét/lấy hàng</tspan><tspan x="1752.5" dy="21">Báo số thực lấy / shortage</tspan></text><polygon points="1950,525 1975,550 1950,575 1925,550" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1950" y="558" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1950" dy="0">×</tspan></text><text x="1950" y="513" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1950" dy="0">Đủ lượng đã giao?</tspan></text><rect x="2210" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2322.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2322.5" dy="0">Tx: STORAGE → STAGING</tspan><tspan x="2322.5" dy="21">PICK_OUT / PICK_IN</tspan><tspan x="2322.5" dy="21">Giảm reserved nguồn cùng tx</tspan></text><rect x="2495" y="335" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="2509" cy="347" r="4" fill="none" stroke="#507091"/><path d="M2503 360 Q2509 346 2515 360" fill="none" stroke="#507091"/><text x="2607.5" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2607.5" dy="0">Xác nhận giao/xuất</tspan><tspan x="2607.5" dy="21">Người có quyền SHIP tương ứng</tspan></text><rect x="2780" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2892.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2892.5" dy="0">Tx: SHIP trừ STAGING</tspan><tspan x="2892.5" dy="21">Ghi ledger + trạng thái xuất</tspan><tspan x="2892.5" dy="21">Không trừ STORAGE lần hai</tspan></text><circle cx="3083" cy="567" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="3083" y="609" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="3083" dy="0">Hoàn tất</tspan></text><rect x="875" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="889" cy="247" r="4" fill="none" stroke="#507091"/><path d="M883 260 Q889 246 895 260" fill="none" stroke="#507091"/><text x="997.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="997.5" dy="0">Báo thiếu tồn</tspan><tspan x="997.5" dy="21">Điều chỉnh đơn / chờ bổ sung</tspan></text><rect x="2015" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="2029" cy="247" r="4" fill="none" stroke="#507091"/><path d="M2023 260 Q2029 246 2035 260" fill="none" stroke="#507091"/><text x="2137.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2137.5" dy="0">Ghi nhận shortage</tspan><tspan x="2137.5" dy="21">Supervisor xử lý lại task</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Pick là chuyển vị trí: tổng kho không đổi. Ship trừ STAGING: tổng kho giảm đúng lượng giao.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Thiếu hàng: báo Supervisor, không tự ghi đủ. Partial/cancel, chọn lô và FEFO cần contract riêng.</tspan></text><text x="28" y="828" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Tài liệu kiểm thử ghi “PICK/SHIP -30” còn mơ hồ; sơ đồ chọn phân tách theo movement types và ghi chú này.</tspan></text></g></svg>