<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="870" viewBox="0 0 3000 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="3000" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Đăng nhập, token và phân quyền</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Áp dụng cho mọi role. Mỗi API bảo vệ kiểm tra lại user ACTIVE và assignment/role ACTIVE.</tspan></text><rect x="20" y="115" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Người dùng</text><rect x="20" y="305" width="2960" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE</text><rect x="20" y="495" width="2960" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">DB / RBAC</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,377 500,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,377 755,377 755,360 785,360" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="835,360 952.5,360 952.5,377 1070,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="936.7" y="342.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="952.5" y="359.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="952.5" dy="0">Có</tspan></text><polyline points="1295,377 1325,377 1325,187 1355,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1580,187 1610,187 1610,377 1640,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1865,377 1895,377 1895,567 1925,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2150,567 2180,567 2180,360 2210,360" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2260,360 2377.5,360 2377.5,377 2495,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="2361.7" y="342.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="2377.5" y="359.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2377.5" dy="0">Có</tspan></text><polyline points="2720,377 2780,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="810,385 810,268 875,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="842.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="842.5" dy="0">Không</tspan></text><polyline points="997.5,300 997.5,680 327.5,680 327.5,229" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="596" y="654" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="662.5" y="671" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="662.5" dy="0">Xử lý / thử lại</tspan></text><polyline points="2235,385 2235,268 2300,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="2240" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="2267.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2267.5" dy="0">Không</tspan></text><polyline points="2545,267.5 2560,267.5 2560,268 2575,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Nhập username hoặc email</tspan><tspan x="327.5" dy="21">Và password</tspan></text><rect x="500" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Tìm account; kiểm tra hash</tspan><tspan x="612.5" dy="21">Chặn inactive/locked</tspan><tspan x="612.5" dy="21">Định danh mơ hồ → 401</tspan></text><polygon points="810,335 835,360 810,385 785,360" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="810" y="368" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">×</tspan></text><text x="810" y="323" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">Đăng nhập đúng?</tspan></text><rect x="1070" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1182.5" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Cấp access + refresh</tspan><tspan x="1182.5" dy="21">Claim tokenType; secret riêng</tspan></text><rect x="1355" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1369" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1363 170 Q1369 156 1375 170" fill="none" stroke="#507091"/><text x="1467.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Gọi API với access token</tspan><tspan x="1467.5" dy="21">Hoặc refresh khi hết hạn</tspan></text><rect x="1640" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1752.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1752.5" dy="0">Verify signature/expiry/type</tspan><tspan x="1752.5" dy="21">Refresh: user ACTIVE → token</tspan><tspan x="1752.5" dy="21">API: đọc user/role/permission</tspan></text><rect x="1925" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2037.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2037.5" dy="0">Permission và scope kho</tspan><tspan x="2037.5" dy="21">Trên cùng assignment active</tspan><tspan x="2037.5" dy="21">Đọc kho từ bản ghi thực tế</tspan></text><polygon points="2235,335 2260,360 2235,385 2210,360" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="2235" y="368" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="2235" dy="0">×</tspan></text><text x="2235" y="323" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2235" dy="0">Được phép?</tspan></text><rect x="2495" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2607.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2607.5" dy="0">Thực thi nghiệp vụ</tspan><tspan x="2607.5" dy="21">Ghi actor/audit từ user</tspan><tspan x="2607.5" dy="21">Trả response / lỗi nghiệp vụ</tspan></text><circle cx="2798" cy="377" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2798" y="419" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2798" dy="0">Hoàn tất</tspan></text><rect x="875" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="889" cy="247" r="4" fill="none" stroke="#507091"/><path d="M883 260 Q889 246 895 260" fill="none" stroke="#507091"/><text x="997.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="997.5" dy="0">401 chung</tspan><tspan x="997.5" dy="21">Sửa thông tin đăng nhập</tspan></text><rect x="2300" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="2314" cy="247" r="4" fill="none" stroke="#507091"/><path d="M2308 260 Q2314 246 2320 260" fill="none" stroke="#507091"/><text x="2422.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2422.5" dy="0">401 hoặc 403</tspan><tspan x="2422.5" dy="21">Không chạy nghiệp vụ</tspan></text><circle cx="2593" cy="268" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2593" y="310" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2593" dy="0">Từ chối</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Thiếu/sai/hết hạn/sai loại token: 401; thiếu permission hoặc scope: 403. Refresh không tự thu hồi token cũ.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Login/refresh là xác thực; gán role yêu cầu ADMIN toàn hệ thống theo policy code hiện tại.</tspan></text></g></svg>