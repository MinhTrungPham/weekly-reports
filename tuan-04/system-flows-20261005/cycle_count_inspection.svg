<svg xmlns="http://www.w3.org/2000/svg" width="2715" height="870" viewBox="0 0 2715 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="2715" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Kiểm kê và kiểm tra chất lượng</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Luồng team theo tài liệu mới; nối sang BPMN Adjustment. Không tự sửa inventory từ kết quả đếm.</tspan></text><rect x="20" y="115" width="2675" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Supervisor</text><rect x="20" y="305" width="2675" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Inspector</text><rect x="20" y="495" width="2675" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE + DB</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,567 500,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,567 785,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1010,567 1040,567 1040,377 1070,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1295,377 1325,377 1325,567 1355,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1580,567 1610,567 1610,550 1640,550" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1690,550 1807.5,550 1807.5,377 1925,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1791.7" y="437.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1807.5" y="454.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1807.5" dy="0">Có</tspan></text><polyline points="2150,377 2180,377 2180,187 2210,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2435,187 2495,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1665,575 1665,643 1730,643" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1670" y="617" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1697.5" y="634" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1697.5" dy="0">Không</tspan></text><polyline points="1975,642.5 1990,642.5 1990,643 2005,643" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Tạo phiên kiểm kê</tspan><tspan x="327.5" dy="21">Kho, BIN/SKU; giao Inspector</tspan></text><rect x="500" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Quyền/scope; assignee ACTIVE</tspan><tspan x="612.5" dy="21">Đọc inventoryId/lot/serial</tspan><tspan x="612.5" dy="21">Chốt thời điểm snapshot</tspan></text><rect x="785" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="897.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="897.5" dy="0">Lưu phiên + danh sách dòng</tspan><tspan x="897.5" dy="21">Snapshot qty/version</tspan><tspan x="897.5" dy="21">Giao việc</tspan></text><rect x="1070" y="335" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1084" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1078 360 Q1084 346 1090 360" fill="none" stroke="#507091"/><text x="1182.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Đếm thực tế base UOM</tspan><tspan x="1182.5" dy="21">Kiểm tra lot/expiry/chất lượng</tspan><tspan x="1182.5" dy="21">Ghi nhận theo dòng tồn</tspan></text><rect x="1355" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1467.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Nộp kết quả; kiểm tra owner</tspan><tspan x="1467.5" dy="21">Tính chênh lệch so snapshot</tspan><tspan x="1467.5" dy="21">Lưu kết quả; không ghi ledger</tspan></text><polygon points="1665,525 1690,550 1665,575 1640,550" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1665" y="558" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1665" dy="0">×</tspan></text><text x="1665" y="513" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1665" dy="0">Có chênh lệch?</tspan></text><rect x="1925" y="335" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1939" cy="347" r="4" fill="none" stroke="#507091"/><path d="M1933 360 Q1939 346 1945 360" fill="none" stroke="#507091"/><text x="2037.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2037.5" dy="0">Inspector tạo Adjustment</tspan><tspan x="2037.5" dy="21">inventoryId + actualQty + reason</tspan><tspan x="2037.5" dy="21">Theo BPMN Điều chỉnh</tspan></text><rect x="2210" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="2224" cy="157" r="4" fill="none" stroke="#507091"/><path d="M2218 170 Q2224 156 2230 170" fill="none" stroke="#507091"/><text x="2322.5" y="171" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2322.5" dy="0">Theo dõi kết quả / xử lý</tspan><tspan x="2322.5" dy="21">Chất lượng là hồ sơ riêng</tspan><tspan x="2322.5" dy="21">Duyệt tồn qua Adjustment</tspan></text><circle cx="2513" cy="187" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2513" y="229" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2513" dy="0">Hoàn tất</tspan></text><rect x="1730" y="610" width="245" height="65" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1852.5" y="637" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1852.5" dy="0">Hoàn tất kiểm kê</tspan><tspan x="1852.5" dy="21">Không tạo Adjustment</tspan></text><circle cx="2023" cy="643" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2023" y="685" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2023" dy="0">Khớp tồn</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Nếu không chênh lệch: hoàn tất kiểm kê, tồn/ledger không đổi. Review count không đồng nghĩa approve adjustment.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Schema/DTO Cycle Count phải thống nhất identity và thời điểm snapshot; chưa mặc định code đã đáp ứng.</tspan></text><text x="28" y="828" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Quarantine/QC/DAMAGED là bước thiết kế bổ sung nếu có chuyển hàng; muốn đổi vị trí phải dùng movement hợp lệ.</tspan></text></g></svg>