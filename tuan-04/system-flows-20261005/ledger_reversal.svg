<svg xmlns="http://www.w3.org/2000/svg" width="2145" height="870" viewBox="0 0 2145 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#50667f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="2145" height="100" fill="#eef4fa"/><text x="28" y="35" font-size="26" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">BPMN — Sửa sai bằng bút toán đảo</tspan></text><text x="28" y="72" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">ADMIN hoặc người được cấp STOCK_LEDGER.REVERSE; không UPDATE/DELETE dòng sổ cái cũ.</tspan></text><rect x="20" y="115" width="2105" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="115" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 210) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Người có quyền reversal</text><rect x="20" y="305" width="2105" height="190" fill="#f5f9fc" stroke="#afc0d3"/><rect x="20" y="305" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 400) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">Hệ thống BE</text><rect x="20" y="495" width="2105" height="190" fill="#ffffff" stroke="#afc0d3"/><rect x="20" y="495" width="100" height="190" fill="#e8f0f8" stroke="#afc0d3"/><text transform="translate(74 590) rotate(-90)" text-anchor="middle" fill="#17283d" font-size="18">DB inventory + ledger</text><polyline points="176,193 195.5,193 195.5,187 215,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,187 470,187 470,377 500,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="725,377 755,377 755,360 785,360" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="835,360 952.5,360 952.5,567 1070,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="936.7" y="437.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="952.5" y="454.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="952.5" dy="0">Có</tspan></text><polyline points="1295,567 1325,567 1325,377 1355,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1580,377 1610,377 1610,187 1640,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1865,187 1925,187" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="810,385 810,268 875,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="842.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="842.5" dy="0">Không</tspan></text><polyline points="1120,267.5 1135,267.5 1135,268 1150,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="181.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Chọn ledger gốc</tspan><tspan x="327.5" dy="21">Nhập lý do reversal</tspan></text><rect x="500" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Xác thực + permission/scope</tspan><tspan x="612.5" dy="21">Đọc ledger gốc + inventory</tspan><tspan x="612.5" dy="21">Không đảo một reversal</tspan></text><polygon points="810,335 835,360 810,385 785,360" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="810" y="368" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">×</tspan></text><text x="810" y="323" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="810" dy="0">Được đảo?</tspan></text><rect x="1070" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1182.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Transaction: delta = -delta gốc</tspan><tspan x="1182.5" dy="21">Tồn không âm / dưới reserved</tspan><tspan x="1182.5" dy="21">INSERT reversal_of_id + audit</tspan></text><rect x="1355" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1467.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1467.5" dy="0">Trả ledger mới</tspan><tspan x="1467.5" dy="21">Ledger cũ giữ nguyên</tspan><tspan x="1467.5" dy="21">Đối soát qty before/after</tspan></text><rect x="1640" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1654" cy="157" r="4" fill="none" stroke="#507091"/><path d="M1648 170 Q1654 156 1660 170" fill="none" stroke="#507091"/><text x="1752.5" y="171" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1752.5" dy="0">Nếu cần ghi nghiệp vụ đúng:</tspan><tspan x="1752.5" dy="21">Thực hiện luồng chứng từ hợp lệ</tspan><tspan x="1752.5" dy="21">Không sửa trực tiếp tồn</tspan></text><circle cx="1943" cy="187" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="1943" y="229" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1943" dy="0">Hoàn tất</tspan></text><rect x="875" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="889" cy="247" r="4" fill="none" stroke="#507091"/><path d="M883 260 Q889 246 895 260" fill="none" stroke="#507091"/><text x="997.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="997.5" dy="0">Không tồn tại / đã đảo / lỗi quyền</tspan><tspan x="997.5" dy="21">Không thay đổi tồn hay ledger</tspan></text><circle cx="1168" cy="268" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="1168" y="310" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1168" dy="0">Từ chối</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Mỗi ledger gốc chỉ đảo tối đa một lần; unique reversal_of_id chống đảo trùng.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Đảo movement thuộc phiếu không tự sửa trạng thái Receipt/Shipment; cần policy chứng từ liên quan.</tspan></text><text x="28" y="828" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Rollback toàn bộ nếu lỗi ledger/tồn. Reversal không thay thế quy trình hủy chứng từ đã nhận.</tspan></text></g></svg>