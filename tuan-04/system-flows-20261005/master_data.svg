0667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1295,377 1325,377 1325,360 1355,360" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1405,360 1522.5,360 1522.5,567 1640,567" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1506.7" y="437.5" width="31.6" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1522.5" y="454.5" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1522.5" dy="0">Có</tspan></text><polyline points="1865,567 1895,567 1895,377 1925,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2150,377 2210,377" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,385 1380,268 1445,268" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1385" y="242" width="55" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="1412.5" y="259" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1412.5" dy="0">Không</tspan></text><polyline points="1567.5,300 1567.5,680 327.5,680 327.5,229" fill="none" stroke="#50667f" stroke-width="2" marker-end="url(#arrow)"/><rect x="881" y="654" width="133" height="20" rx="3" fill="white" fill-opacity="0.96"/><text x="947.5" y="671" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="947.5" dy="0">Xử lý / thử lại</tspan></text><circle cx="158" cy="193" r="18" fill="white" stroke="#294d72" stroke-width="2"/><text x="158" y="235" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="158" dy="0">Bắt đầu</tspan></text><rect x="215" y="145" width="225" height="84" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="229" cy="157" r="4" fill="none" stroke="#507091"/><path d="M223 170 Q229 156 235 170" fill="none" stroke="#507091"/><text x="327.5" y="171" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="327.5" dy="0">Tạo/sửa/ngưng hoạt động</tspan><tspan x="327.5" dy="21">User/RBAC, kho/vị trí, SKU/UOM</tspan><tspan x="327.5" dy="21">Supplier, barcode/conversion</tspan></text><rect x="500" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="612.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="612.5" dy="0">Xác thực; permission + scope</tspan><tspan x="612.5" dy="21">Tạo/ngưng kho: ADMIN</tspan><tspan x="612.5" dy="21">User/RBAC: policy global</tspan></text><rect x="785" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="897.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="897.5" dy="0">Đọc bản ghi + tham chiếu</tspan><tspan x="897.5" dy="21">Tồn, ledger, cây vị trí</tspan><tspan x="897.5" dy="21">User-role và master liên quan</tspan></text><rect x="1070" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1182.5" y="361" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1182.5" dy="0">Unique code; FK; cây cùng kho</tspan><tspan x="1182.5" dy="21">Hệ số &gt; 0; barcode unique</tspan><tspan x="1182.5" dy="21">Base UOM/code sau giao dịch</tspan></text><polygon points="1380,335 1405,360 1380,385 1355,360" fill="#fff4cd" stroke="#a47a11" stroke-width="2"/><text x="1380" y="368" font-size="28" text-anchor="middle" fill="#17283d"><tspan x="1380" dy="0">×</tspan></text><text x="1380" y="323" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="1380" dy="0">Hợp lệ?</tspan></text><rect x="1640" y="525" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="1752.5" y="551" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1752.5" dy="0">Transaction + audit</tspan><tspan x="1752.5" dy="21">Master đã tham chiếu: inactive</tspan><tspan x="1752.5" dy="21">Không hard-delete lịch sử</tspan></text><rect x="1925" y="335" width="225" height="84" rx="12" fill="#f3f0ff" stroke="#507091" stroke-width="2"/><text x="2037.5" y="371.5" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="2037.5" dy="0">Trả ID / dữ liệu / trạng thái</tspan><tspan x="2037.5" dy="21">FE cập nhật danh sách</tspan></text><circle cx="2228" cy="377" r="18" fill="white" stroke="#294d72" stroke-width="4"/><text x="2228" y="419" font-size="14" text-anchor="middle" fill="#17283d"><tspan x="2228" dy="0">Hoàn tất</tspan></text><rect x="1445" y="235" width="245" height="65" rx="12" fill="#e9f3ff" stroke="#507091" stroke-width="2"/><circle cx="1459" cy="247" r="4" fill="none" stroke="#507091"/><path d="M1453 260 Q1459 246 1465 260" fill="none" stroke="#507091"/><text x="1567.5" y="262" font-size="16" text-anchor="middle" fill="#17283d"><tspan x="1567.5" dy="0">400 / 403 / 404 / 409</tspan><tspan x="1567.5" dy="21">Không ghi DB; sửa request</tspan></text><text x="28" y="780" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Tổng hợp rule A/B/C: user ACTIVE, scope; cấu trúc ZONE/AISLE/RACK/BIN; không deactivate BIN/SKU còn tồn.</tspan></text><text x="28" y="804" font-size="16" text-anchor="start" fill="#17283d"><tspan x="28" dy="0">Mã permission cụ thể theo catalog hiện hành; không suy ra Manager có mọi quyền từ tên role.</tspan></text></g></svg>